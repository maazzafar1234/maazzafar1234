<svg width="320" height="480" viewBox="0 0 320 480" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Fira Code',monospace">
  <defs>
    <clipPath id="avatarClip">
      <circle cx="0" cy="-38" r="42"/>
    </clipPath>
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a0d1a"/>
      <stop offset="50%" stop-color="#ff1e3c"/>
      <stop offset="100%" stop-color="#7a0d1a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141014"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="redGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- pendulum group: whole lanyard swings from the fixed anchor at top -->
  <g transform="translate(160,30)">
    <animateTransform attributeName="transform" type="rotate"
      values="-4 160 -30; 4 160 -30; -4 160 -30"
      keyTimes="0;0.5;1" dur="4.2s" repeatCount="indefinite" additive="sum"/>
    <g transform="translate(0,0) rotate(0) translate(-160,-30)">
    </g>

    <!-- anchor clip -->
    <circle cx="0" cy="-30" r="7" fill="#222" stroke="#ff1e3c" stroke-width="1.5"/>

    <!-- strap -->
    <rect x="-14" y="-30" width="28" height="150" fill="url(#strapGrad)" rx="3"/>
    <g fill="#0a0a0c" font-size="8" font-weight="700" letter-spacing="1">
      <text x="0" y="10" text-anchor="middle" transform="rotate(90 0 10)">SHADOW-DEV</text>
      <text x="0" y="60" text-anchor="middle" transform="rotate(90 0 60)">MAAZ ZAFAR</text>
      <text x="0" y="110" text-anchor="middle" transform="rotate(90 0 110)">NINJA CODER</text>
    </g>

    <!-- clip -->
    <rect x="-10" y="118" width="20" height="14" rx="3" fill="#1c1c1c" stroke="#ff1e3c" stroke-width="1"/>
    <circle cx="0" cy="132" r="5" fill="#1c1c1c" stroke="#ff1e3c" stroke-width="1"/>

    <!-- ID card -->
    <g transform="translate(0,150)">
      <rect x="-110" y="0" width="220" height="290" rx="16" fill="url(#cardGrad)" stroke="#ff1e3c" stroke-opacity="0.6" filter="url(#cardShadow)"/>
      <rect x="-110" y="0" width="220" height="290" rx="16" fill="none" stroke="#ff1e3c" stroke-opacity="0.25" stroke-width="6"/>

      <!-- header strip -->
      <rect x="-110" y="0" width="220" height="30" rx="16" fill="#ff1e3c" fill-opacity="0.12"/>
      <text x="0" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#ff1e3c" letter-spacing="2">SHADOW CLAN ID</text>

      <!-- avatar -->
      <g transform="translate(0,90)">
        <circle cx="0" cy="-38" r="46" fill="#000" stroke="#ff1e3c" stroke-width="2" filter="url(#redGlow)"/>
        <image href="avatar.png"
               x="-42" y="-80" width="84" height="84" clip-path="url(#avatarClip)" preserveAspectRatio="xMidYMid slice"/>
        <circle cx="0" cy="-38" r="42" fill="none" stroke="#ff1e3c" stroke-width="1.5" opacity="0.8">
          <animate attributeName="r" values="42;46;42" dur="2.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.4s" repeatCount="indefinite"/>
        </circle>
      </g>

      <text x="0" y="120" text-anchor="middle" font-size="17" font-weight="700" fill="#f5f5f5">Maaz Zafar</text>
      <text x="0" y="140" text-anchor="middle" font-size="10" fill="#ff8a97" letter-spacing="1">FULL-STACK DEVELOPER</text>

      <line x1="-85" y1="155" x2="85" y2="155" stroke="#ff1e3c" stroke-opacity="0.3"/>

      <g font-size="10" fill="#c9c9c9">
        <text x="-85" y="178">ROLE</text>
        <text x="85" y="178" text-anchor="end" fill="#f5f5f5">Java + React</text>
        <text x="-85" y="198">CLAN</text>
        <text x="85" y="198" text-anchor="end" fill="#f5f5f5">Hexaview Tech</text>
        <text x="-85" y="218">BASE</text>
        <text x="85" y="218" text-anchor="end" fill="#f5f5f5">Noida, IN</text>
        <text x="-85" y="238">RANK</text>
        <text x="85" y="238" text-anchor="end" fill="#f5f5f5">API Assassin</text>
      </g>

      <!-- barcode -->
      <g transform="translate(-85,255)" fill="#ff1e3c" fill-opacity="0.8">
        <rect x="0" y="0" width="2" height="24"/><rect x="4" y="0" width="1" height="24"/>
        <rect x="7" y="0" width="3" height="24"/><rect x="12" y="0" width="1" height="24"/>
        <rect x="15" y="0" width="2" height="24"/><rect x="19" y="0" width="1" height="24"/>
        <rect x="22" y="0" width="3" height="24"/><rect x="27" y="0" width="2" height="24"/>
        <rect x="31" y="0" width="1" height="24"/><rect x="34" y="0" width="3" height="24"/>
        <rect x="39" y="0" width="1" height="24"/><rect x="42" y="0" width="2" height="24"/>
        <rect x="46" y="0" width="1" height="24"/><rect x="49" y="0" width="3" height="24"/>
        <rect x="54" y="0" width="2" height="24"/><rect x="58" y="0" width="1" height="24"/>
        <rect x="61" y="0" width="3" height="24"/><rect x="66" y="0" width="1" height="24"/>
        <rect x="69" y="0" width="2" height="24"/><rect x="73" y="0" width="3" height="24"/>
      </g>
      <text x="0" y="290" text-anchor="middle" font-size="8" fill="#666" letter-spacing="1">— drag me… just kidding, I'm an SVG —</text>
    </g>
  </g>
</svg>
