name: Generate Ninja Snake

on:
  schedule:
    - cron: "0 2 * * *"   # daily at 02:00 UTC
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: maazzafar1234
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff1e3c&color_dots=#160406,#3a0a10,#7a0d1a,#c8102e,#ff1e3c
            dist/snake-light.svg?palette=github-light&color_snake=#c8102e&color_dots=#f4e6e7,#f1dde0,#e8b9be,#c8102e,#8c0c1f

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
