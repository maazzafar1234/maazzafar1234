      <text x="88" y="34" text-anchor="middle" font-size="22">🔥</text>
      <text x="88" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#f5f5f5">Streak Ronin</text>
      <text x="88" y="78" text-anchor="middle" font-size="9" fill="#999">Active Streak</text>
      <text x="88" y="108" text-anchor="middle" font-size="16" font-weight="700" fill="#ff1e3c">B</text>
      <rect width="176" height="130" rx="12" fill="none" stroke="#ff1e3c" stroke-width="1.5" opacity="0.5">
