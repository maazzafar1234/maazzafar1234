      <text x="88" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#f5f5f5">Star Collector</text>
      <text x="88" y="78" text-anchor="middle" font-size="9" fill="#999">Stars 3+</text>
      <text x="88" y="108" text-anchor="middle" font-size="16" font-weight="700" fill="#ff1e3c">B</text>
      <rect width="176" height="130" rx="12" fill="none" stroke="#ff1e3c" stroke-width="1.5" opacity="0.5">
        <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.6s" begin="0.9s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- tile 5 -->
    <g transform="translate(794,10)">
      <rect width="176" height="130" rx="12" fill="url(#trophyBg)" stroke="#ff1e3c" stroke-opacity="0.6"/>
