        <rect x="-220" y="0" width="90" height="130" fill="url(#shimmerGrad)" transform="skewX(-20)">
          <animate attributeName="x" values="-220;260" dur="3.5s" begin="0.5s" repeatCount="indefinite"/>
        </rect>
      </g>
      <text x="88" y="34" text-anchor="middle" font-size="22">🌑</text>
      <text x="88" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#f5f5f5">Night Owl</text>
      <text x="88" y="78" text-anchor="middle" font-size="9" fill="#999">Late Commits</text>
      <text x="88" y="108" text-anchor="middle" font-size="16" font-weight="700" fill="#ff1e3c">A</text>
      <rect width="176" height="130" rx="12" fill="none" stroke="#ff1e3c" stroke-width="1.5" opacity="0.5">
        <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.6s" begin="0.3s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- tile 3 -->
    <g transform="translate(402,10)">
      <rect width="176" height="130" rx="12" fill="url(#trophyBg)" stroke="#ff1e3c" stroke-opacity="0.6"/>
      <g clip-path="url(#tileClip)">
        <rect x="-220" y="0" width="90" height="130" fill="url(#shimmerGrad)" transform="skewX(-20)">
