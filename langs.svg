<svg width="480" height="230" viewBox="0 0 480 230" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Fira Code',monospace">
  <defs>
    <linearGradient id="langsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0708"/>
      <stop offset="100%" stop-color="#160406"/>
    </linearGradient>
  </defs>
  <rect width="480" height="230" rx="14" fill="url(#langsBg)" stroke="#ff1e3c" stroke-opacity="0.5"/>
  <text x="24" y="34" font-size="16" font-weight="700" fill="#ff1e3c">刀 Weapons of Choice</text>
  <line x1="24" y1="46" x2="456" y2="46" stroke="#ff1e3c" stroke-opacity="0.25"/>

  <!-- EDIT_LANGS: adjust % + width (max 400) to match your real top languages -->
  <g font-size="12">
    <text x="24" y="70" fill="#e6e6e6">JavaScript</text>
    <text x="456" y="70" fill="#ff8a97" text-anchor="end">34%</text>
    <rect x="24" y="76" width="400" height="8" rx="4" fill="#2a0a0e"/>
    <rect x="24" y="76" height="8" rx="4" fill="#ff1e3c">
      <animate attributeName="width" values="0;136" dur="1.4s" fill="freeze" begin="0.2s"/>
    </rect>

    <text x="24" y="104" fill="#e6e6e6">Java</text>
    <text x="456" y="104" fill="#ff8a97" text-anchor="end">26%</text>
    <rect x="24" y="110" width="400" height="8" rx="4" fill="#2a0a0e"/>
    <rect x="24" y="110" height="8" rx="4" fill="#ff1e3c">
      <animate attributeName="width" values="0;104" dur="1.4s" fill="freeze" begin="0.4s"/>
    </rect>

    <text x="24" y="138" fill="#e6e6e6">HTML / CSS</text>
    <text x="456" y="138" fill="#ff8a97" text-anchor="end">18%</text>
    <rect x="24" y="144" width="400" height="8" rx="4" fill="#2a0a0e"/>
    <rect x="24" y="144" height="8" rx="4" fill="#ff1e3c">
      <animate attributeName="width" values="0;72" dur="1.4s" fill="freeze" begin="0.6s"/>
    </rect>

    <text x="24" y="172" fill="#e6e6e6">React / Node</text>
    <text x="456" y="172" fill="#ff8a97" text-anchor="end">15%</text>
    <rect x="24" y="178" width="400" height="8" rx="4" fill="#2a0a0e"/>
    <rect x="24" y="178" height="8" rx="4" fill="#ff1e3c">
      <animate attributeName="width" values="0;60" dur="1.4s" fill="freeze" begin="0.8s"/>
    </rect>

    <text x="24" y="206" fill="#e6e6e6">SQL / Python</text>
    <text x="456" y="206" fill="#ff8a97" text-anchor="end">7%</text>
    <rect x="24" y="212" width="400" height="8" rx="4" fill="#2a0a0e"/>
    <rect x="24" y="212" height="8" rx="4" fill="#ff1e3c">
      <animate attributeName="width" values="0;28" dur="1.4s" fill="freeze" begin="1s"/>
    </rect>
  </g>
</svg>
