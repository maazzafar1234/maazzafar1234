      <text x="88" y="78" text-anchor="middle" font-size="9" fill="#999">Repos 12+</text>
      <text x="88" y="108" text-anchor="middle" font-size="16" font-weight="700" fill="#ff1e3c">A</text>
      <rect width="176" height="130" rx="12" fill="none" stroke="#ff1e3c" stroke-width="1.5" opacity="0.5">
        <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.6s" begin="0.6s" repeatCount="indefinite"/>
      </rect>
    </g>
