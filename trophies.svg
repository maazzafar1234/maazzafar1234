<svg width="980" height="150" viewBox="0 0 980 150" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Fira Code',monospace">
  <defs>
    <linearGradient id="trophyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0708"/>
      <stop offset="100%" stop-color="#160406"/>
    </linearGradient>
    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1e3c" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff1e3c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff1e3c" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tileClip"><rect width="176" height="130" rx="12"/></clipPath>
  </defs>
  <!-- 5 trophy tiles: EDIT_TROPHIES: swap labels/ranks as your profile grows -->
  <!-- tile template repeated at x = 0,196,392,588,784, width 176 -->
  <g>
    <!-- tile 1 -->
    <g transform="translate(10,10)">
      <rect width="176" height="130" rx="12" fill="url(#trophyBg)" stroke="#ff1e3c" stroke-opacity="0.6"/>
      <g clip-path="url(#tileClip)">
        <rect x="-220" y="0" width="90" height="130" fill="url(#shimmerGrad)" transform="skewX(-20)">
          <animate attributeName="x" values="-220;260" dur="3.5s" begin="0s" repeatCount="indefinite"/>
        </rect>
      </g>
      <text x="88" y="34" text-anchor="middle" font-size="22">🗡️</text>
      <text x="88" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#f5f5f5">First Blood</text>
      <text x="88" y="78" text-anchor="middle" font-size="9" fill="#999">First Commit</text>
      <text x="88" y="108" text-anchor="middle" font-size="16" font-weight="700" fill="#ff1e3c">S</text>
      <rect width="176" height="130" rx="12" fill="none" stroke="#ff1e3c" stroke-width="1.5" opacity="0.5">
        <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.6s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- tile 2 -->
    <g transform="translate(206,10)">
      <rect width="176" height="130" rx="12" fill="url(#trophyBg)" stroke="#ff1e3c" stroke-opacity="0.6"/>
