<svg width="480" height="230" viewBox="0 0 480 230" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Fira Code',monospace">
  <defs>
    <linearGradient id="statsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0708"/>
      <stop offset="100%" stop-color="#160406"/>
    </linearGradient>
    <filter id="glowS" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="480" height="230" rx="14" fill="url(#statsBg)" stroke="#ff1e3c" stroke-opacity="0.5"/>
  <text x="24" y="34" font-size="16" font-weight="700" fill="#ff1e3c">忍 Maaz's Shadow Stats</text>
  <line x1="24" y1="46" x2="456" y2="46" stroke="#ff1e3c" stroke-opacity="0.25"/>

  <!-- left column: stat rows -->
  <g font-size="13" fill="#e6e6e6">
    <!-- EDIT_STATS: update the numbers below as your GitHub profile grows -->
    <text x="24" y="76">⭐ Stars Earned</text>
    <text x="230" y="76" fill="#ff8a97" font-weight="700">3+</text>
    <text x="24" y="102">📦 Public Repos</text>
    <text x="230" y="102" fill="#ff8a97" font-weight="700">12+</text>
    <text x="24" y="128">🥷 Followers</text>
    <text x="230" y="128" fill="#ff8a97" font-weight="700">1+</text>
    <text x="24" y="154">🔀 Total Commits</text>
    <text x="230" y="154" fill="#ff8a97" font-weight="700">200+</text>
    <text x="24" y="180">⚔️ PRs Merged</text>
    <text x="230" y="180" fill="#ff8a97" font-weight="700">8+</text>
  </g>

  <!-- rank badge -->
  <g transform="translate(390,120)" filter="url(#glowS)">
    <circle r="62" fill="none" stroke="#3a0a10" stroke-width="10"/>
    <circle r="62" fill="none" stroke="#ff1e3c" stroke-width="10" stroke-linecap="round"
            stroke-dasharray="330" stroke-dashoffset="330" transform="rotate(-90)">
      <animate attributeName="stroke-dashoffset" values="330;70" dur="1.8s" fill="freeze" begin="0.3s"/>
    </circle>
    <text x="0" y="6" text-anchor="middle" font-size="30" font-weight="700" fill="#f5f5f5">S</text>
    <text x="0" y="26" text-anchor="middle" font-size="9" fill="#ff8a97" letter-spacing="2">RANK</text>
  </g>

  <text x="24" y="212" font-size="9" fill="#666">Updated manually — no third-party APIs, so this never breaks</text>
</svg>
